<section class="apanaghr-hero">
	<!-- ...existing hero background/overlay/image code... -->
	<div class="apanaghr-hero-inner">
		<!-- Tagline: keep this text; the search bar sits just below it -->
		<h1 class="apanaghr-tagline">Find Your Perfect Living Space</h1>

		<!-- Floating search component -->
		<div class="apanaghr-search-wrapper">
			<nav class="apanaghr-search-tabs" role="tablist" aria-label="Search modes">
				<button class="tab active" role="tab" aria-selected="true" data-mode="pg">Find PG</button>
				<button class="tab" role="tab" aria-selected="false" data-mode="roommates">Find Roommates</button>
				<button class="tab" role="tab" aria-selected="false" data-mode="post">Post a Room</button>
			</nav>

			<form class="apanaghr-search-bar" role="search" aria-label="Search properties">
				<div class="control group-city">
					<label class="visually-hidden" for="city-select">City</label>
					<select id="city-select" class="city-select">
						<option value="">All Cities</option>
						<option>Delhi</option>
						<option>Mumbai</option>
						<option>Bengaluru</option>
						<option>Chennai</option>
						<option>Kolkata</option>
					</select>
				</div>

				<div class="control control-search">
					<label class="visually-hidden" for="area-input">Search by area or locality</label>
					<input id="area-input" class="area-input" type="search" placeholder="Search by area or locality" />
					<button type="button" class="icon mic" aria-label="Voice search" title="Voice search">
						<!-- simple mic SVG -->
						<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2zM11 19h2v3h-2z"/></svg>
					</button>

					<button type="button" class="icon locate" aria-label="Detect my location" title="Detect my location">
						<!-- location SVG -->
						<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0-7h1v3h-1zM12 20h1v3h-1zM3 12h3v1H3zM18 12h3v1h-3zM5 5l2.2 2.2-.7.7L4 5.7zM17.5 17.5l2.2 2.2-.7.7L16.8 18.2zM5 19l2.2-2.2.7.7L5.7 20zM18.2 5.7l.7-.7L20 6.8 18.2 8.6z"/></svg>
					</button>
				</div>

				<div class="control control-action">
					<button class="search-btn" type="submit" aria-label="Search" title="Search">Search</button>
				</div>
			</form>
		</div>
	</div>
</section>
